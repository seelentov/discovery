# discovery-agent — полная конфигурация со всеми настройками, которые вообще можно
# задать через этот файл, и их текущими значениями (для строк ниже, где значение
# совпадает с дефолтом из discovery-bootstrap — их можно спокойно удалить, эффект тот
# же). Ведётся как пример/справочник по прямой просьбе пользователя 2026-08-16: при
# добавлении новой настройки, которая должна конфигурироваться через toml, — сразу
# дописывать её сюда.
#
# Разделение "файл vs БД":
#   - [storage] / [server] / [logging] / [concurrency] / [worker_poll_interval] / [reclaim]
#     читаются ТОЛЬКО отсюда, один раз при старте процесса. Изменение требует
#     перезапуска. Осознанно оставлены в файле (не в БД) — см. discovery/CLAUDE.md.
#   - [poll_intervals] — единственное исключение: читается отсюда только при самом первом
#     запуске, как сид для БД (если там ещё ничего нет). После этого живёт в БД, правится
#     через дашборд ("Настройки") или PUT /api/settings/poll-intervals, применяется без
#     перезапуска. Менять значения здесь после первого запуска смысла не имеет.
#   - Всё остальное (устройства, профили, дискаверинг-конфиги) — только в БД, через
#     дашборд/API, никогда не в этом файле.

[storage]
# Список именованных подключений к БД + маршрутизация 8 доменов данных по ним —
# 2026-08-18, поддержка нескольких СУБД одновременно (postgres/mysql/sqlite/memory) по
# аналогии с AggreGate, но гибче: не "один тип хранилища на всё", а именованный список,
# любой домен можно направить на любую запись, несколько доменов на одной записи делят
# один физический коннект, запись без единой ссылки не подключается вовсе. Редактируется
# и через дашборд ("Настройки — БД"), не только руками — любое изменение требует
# перезапуска процесса, дашборд предупредит и предложит кнопку "перезапустить сейчас"
# (можно отказаться и перезапустить вручную позже, накопив несколько правок).
#
# Без единой записи в storage.databases (обе секции ниже пустые/отсутствуют) — неявное
# in-process подключение (sqlite::memory:) для всех доменов сразу, ничего не переживает
# рестарт, ничего внешнего не требуется — тот же "просто запусти" опыт, что раньше давал
# storage.kind = "memory".
default_database = "main"

[[storage.databases]]
name = "main"
# "postgres" | "mysql" | "sqlite" | "memory"
kind = "postgres"
# Обязательны для kind = "postgres"/"mysql". Соединение собирается из этих отдельных
# полей (а не единой строкой url) — 2026-08-18, прямой запрос пользователя: "куда вводить
# пароль к бд, саму бд, просто url недостаточно". port не задан — используется 5432/3306
# по умолчанию. password не задан — локальный Postgres здесь настроен на доверенную
# аутентификацию по ОС-пользователю, пароль не нужен.
host = "127.0.0.1"
# port = 5432
database = "discovery_dev"
username = "vladislav"
# password = ""
# Обязателен для kind = "sqlite". Неиспользуемо для postgres/mysql/memory.
# file_path = "discovery.sqlite3"
# Размер пула соединений именно ЭТОЙ записи. Не задано (или закомментировано) — дефолт
# зависит от бэкенда: 64 для postgres/mysql, для sqlite — динамически
# ConcurrencyConfig::default().sum() (сейчас тоже 64, следует за суммой [concurrency] ниже
# автоматически, не отдельный захардкоженный литерал — см. `discovery_db::
# default_sqlite_pool_max_connections`'s docs). Больший пул всё равно не даёт параллелизма
# ЗАПИСИ — SQLite сериализует писателей независимо от размера пула — но чтение выигрывает
# от нескольких соединений, особенно вместе с WAL (см. ниже). Неиспользуемо для kind =
# "memory".
#
# ВАЖНО (найдено на scale-аудите 2026-08-21, уточнено аудитом 2026-09-17 — см.
# docs/Changelog/2026-09-17 - Аудит глазами оператора...md, находка #2): каждый воркер
# каждой очереди при claim() берёт соединение из ОДНОГО общего пула той БД, куда роутится
# домен "Очередь заданий" (jobs) — если несколько доменов используют одну и ту же запись
# (обычный случай — все домены на "main" по умолчанию), туда же попадают и
# REST/дашборд-запросы. Пул МЕНЬШЕ суммы [concurrency] ниже не даёт ошибки — воркеры просто
# молча ждут свободное соединение, и реальная пропускная способность окажется ниже
# настроенного concurrency без единой записи в логах об этом. `discovery-agent` при старте
# сам предупредит (warn!), если это так, но проще сразу держать pool_max_connections >=
# суммы [concurrency] (по дефолтным значениям ниже — сейчас 64) с запасом на REST-нагрузку
# дашборда. Для sqlite отдельно: до 2026-09-17 каждая sqlite-БД ещё и оставалась на
# журнальном режиме по умолчанию (DELETE/rollback), где писатель блокирует ВСЕХ читателей —
# именно это, не только нехватка соединений в пуле, было главной причиной вала `database is
# locked` в логах на дефолтной конфигурации. Теперь sqlite-соединения всегда открываются в
# режиме WAL (писатель больше не блокирует читателей) — см. `discovery_db::
# connect_sqlite_file`'s docs.
# pool_max_connections = 64
# Только для kind = "sqlite" — сколько ждать на SQLITE_BUSY, прежде чем сдаться. До
# 2026-09-17 это поле парсилось, но реально ни на что не влияло (мёртвая настройка,
# соединение всегда открывалось со встроенным дефолтом sqlx, тоже 5с — совпадение маскировало
# баг) — теперь действительно передаётся в SqliteConnectOptions::busy_timeout при подключении.
sqlite_busy_timeout_secs = 5

# Какая именованная БД (из storage.databases выше) обслуживает каждый из 8 доменов —
# незаданное/закомментированное поле значит "используй storage.default_database".
# Изначально все домены используют одну БД по умолчанию ("main") — раздельные записи
# здесь нужны, только если реально хотите развести какие-то домены по разным БД
# (например: alerts = "alerts_db", если завели отдельную запись storage.databases с
# именем "alerts_db" под тревоги).
[storage.routing]
# settings = "main"
# alerts = "main"
# devices = "main"
# discovery_configs = "main"
# device_metrics = "main"
# profiles = "main"
# logs = "main"
# jobs = "main"

[server]
addr = "127.0.0.1:8088"
# Независимые переключатели REST API (/api/*) и встроенного webui (статика React-дашборда).
# Аудит 2026-08-29 подтвердил: webui — чистый REST-клиент (весь его сетевой код это один
# fetch-wrapper в frontend/src/api/http.ts, никакого WebSocket/SSE и т.п.), никаких действий,
# недоступных через REST, у него нет — так что enable_rest=false делает webui нерабочим,
# даже если сам он включён (его же запросы получат 404). Это ожидаемо, а не баг: тумблеры
# независимы для сценариев вида "только REST для headless-инсталляции" или "выключить
# отдачу статики дашборда, но оставить API". Если оба false — с системой становится
# невозможно взаимодействовать по HTTP вообще; discovery-agent в этом случае всё равно
# стартует, но пишет warn в логи. Читается один раз при старте, как весь остальной [server].
enable_rest = true
enable_webui = true

[logging]
# Общий уровень-фолбэк для всех трёх приёмников ниже
level = "info"
# Пусто = наследовать level. Можно переопределить по отдельности под каждый приёмник.
level_console = ""
level_file = ""
level_dashboard = ""
# Пустая строка выключает файловый приёмник целиком
file = "logs/discovery.log"
# "daily" | "hourly" | "never"
file_rotation = "daily"
# Размер кольцевого буфера логов для дашборда (последние N записей, GET /api/logs)
buffer_size = 1000

[concurrency]
# Сколько воркеров одновременно обрабатывают каждую очередь — независимый лимит на
# каждый этап пайплайна (discovery -> snmp_poll -> dedup -> profile_apply -> metric_poll,
# плюс отдельные reachability_poll, alert_eval, service_check_poll, notification_dispatch,
# topology_recompute).
#
# МАСШТАБИРОВАНИЕ: дефолты ниже (сумма = 64 — см. `ConcurrencyConfig::sum`) рассчитаны на
# малый-средний парк, см. [poll_intervals]'s комментарий выше. При росте парка эти значения
# нужно поднимать ВМЕСТЕ с pool_max_connections той БД, куда роутится домен "Очередь
# заданий" (jobs) — `discovery-agent` предупредит в логах (warn!) при старте, если
# pool_max_connections меньше суммы значений ниже, но само по себе не поднимет ни то, ни
# другое. Список ниже должен зеркалить каждое поле `discovery_bootstrap::ConcurrencyConfig`
# один в один — оно отстало от реального списка полей один раз уже (2026-09-16,
# topology_recompute; заметено только аудитом 2026-09-17, не раньше), поэтому при
# добавлении новой очереди — сразу дописывай её сюда же.
discovery = 4
snmp_poll = 8
dedup = 4
profile_apply = 4
metric_poll = 8
alert_eval = 4
reachability_poll = 8
# Проверки сервисов L4/L7 (2026-09-04) — TCP/HTTP/SSH reachability отдельно от SNMP-опроса.
service_check_poll = 8
# Уведомления (2026-09-10) — один воркер-пул на всю доставку email/Telegram/webhook,
# одна задача = одна попытка доставки в один канал (см. QueueKind::NotificationDispatch).
notification_dispatch = 8
# Пересчёт топологии (2026-09-16) — реактивный, по одной задаче на устройство сразу после
# свежего опроса метрик, а не по своему таймеру (см. QueueKind::TopologyRecompute).
topology_recompute = 8

[worker_poll_interval]
# Как часто воркер-пул каждой очереди пытается забрать новую пачку заданий (не путать
# с poll_intervals ниже — это про переопрос устройств, а это про каданс самого claim-цикла
# над таблицей заданий). Спавнится один раз при старте, живой перечитки нет.
discovery_ms = 500
snmp_poll_ms = 500
dedup_ms = 500
profile_apply_ms = 500
# Дольше остальных намеренно — MetricPollHandler сам троттлит себя по каждой (устройство,
# метрика) паре, этому claim-циклу не нужно опрашивать так же часто, как остальным.
metric_poll_ms = 1000
alert_eval_ms = 500
reachability_poll_ms = 500
service_check_poll_ms = 500
notification_dispatch_ms = 500
topology_recompute_ms = 500

[reclaim]
# Цикл восстановления после падения воркера: как часто проверяем и через сколько секунд
# "in_progress"-задание считается зависшим и возвращается в pending.
check_interval_secs = 30
stale_after_secs = 300

# ---------------------------------------------------------------------------------------
# poll_intervals — исключение из правила выше, см. пояснение в начале файла: это только
# одноразовый сид для БД при первом запуске, не живая настройка. Актуальные значения —
# в дашборде ("Настройки") или GET /api/settings/poll-intervals.
# ---------------------------------------------------------------------------------------
[poll_intervals]
# МАСШТАБИРОВАНИЕ (добавлено 2026-08-21, scale-аудит): дефолты ниже (identity_secs=300,
# metric_secs=15, reachability_secs=60) рассчитаны на малый-средний парк устройств —
# типичного клиента этого продукта (небольшой региональный провайдер), не на десятки/сотни
# тысяч устройств. Прикидка нагрузки на дефолтах: N устройств дают примерно
# N/identity_secs SnmpPoll-job'ов/сек, N/metric_secs MetricPoll-job'ов/сек (каждый —
# реальный SNMP-запрос), N/reachability_secs ReachabilityPoll-job'ов/сек. При 500 000
# устройств на дефолтах это ≈33 300 MetricPoll job/сек — для такого парка нужно (а)
# заметно поднять metric_secs/identity_secs/reachability_secs (реже опрашивать каждое
# устройство) и/или (б) поднять [concurrency] ниже и pool_max_connections в [[storage.
# databases]] пропорционально. Для малого/среднего парка эти дефолты трогать не нужно.
# Как часто переопрашивается идентичность устройства (SnmpPoll)
identity_secs = 300
# Периодичность опроса метрик профиля по умолчанию (MetricPoll), если в самой метрике
# не задано своё расписание
metric_secs = 15
# Как часто фоновый цикл проверяет, не изменился ли набор профилей (hot-reload)
profiles_reload_secs = 5
# Как часто проверяется расписание конфигураций дискаверинга (должно быть заметно
# меньше 60с, чтобы не пропустить назначенную минуту)
discovery_schedule_check_secs = 30
# Как часто чистится история метрик, вышедшая за history_retention_secs профиля
metric_history_cleanup_secs = 3600
# Периодичность проверки ping/SNMP-доступности устройства (ReachabilityPoll)
reachability_secs = 60
# Как часто чистится история тревог, вышедшая за настроенный срок хранения
# (settings.alert_retention, редактируется в дашборде — "Настройки — хранение тревог")
alert_cleanup_secs = 3600
# Как часто проверяются недоступные устройства на предмет удаления (settings.
# dead_device_retention, редактируется в дашборде — "Настройки — удаление недоступных
# устройств"). Было пропущено в этом справочнике до 2026-08-21 — добавлено по ходу
# scale-аудита.
dead_device_cleanup_secs = 3600
# Как часто чистятся логи, вышедшие за настроенный срок хранения (settings.log_retention,
# редактируется в дашборде — "Настройки — хранение логов"). Добавлено 2026-08-21,
# scale-аудит: в отличие от истории метрик/тревог, у логов retention не было вообще.
logs_cleanup_secs = 3600
# Как часто чистятся протухшие по ttl_secs строки/факты trap-производных метрик
# (metrics.trap_<имя биндинга>) — единственный путь к "Утеряна" для данных из трапов, см.
# [snmp_trap] ниже. Добавлено 2026-08-30.
trap_ttl_sweep_secs = 60

[snmp_trap]
# SNMP Trap — приём push-уведомлений от устройств (v1/v2c/v3), в дополнение к обычному
# poll-опросу. См. docs/Changelog/2026-08-30 - SNMP Trap.md за полным разбором дизайна.
#
# ВЫКЛЮЧЕНО ПО УМОЛЧАНИЮ — в отличие от остальных секций этого файла, включение открывает
# UDP-порт на приём; существующая установка не должна получить это молча при апдейте.
enabled = false
# Не стандартный 162 порт по умолчанию — бинд на него требует root/CAP_NET_BIND_SERVICE.
# Для продакшна с реальным портом 162 указать явно и выдать процессу capability.
bind_addr = "0.0.0.0:1162"
# Размер in-memory пула воркеров, разбирающих уже провалидированные пакеты (НЕ через
# jobs-очередь — см. changelog за обоснованием). Тот же класс стоимости, что
# concurrency.snmp_poll/metric_poll.
ingest_concurrency = 8
# Token bucket на source IP, до всякого decode — первая, самая дешёвая линия защиты от
# шторма трапов (авария на агрегации — это не один трап, а сотни/тысячи в секунды).
rate_limit_per_source_per_sec = 20
# Ingress ACL (SEC-19, 2026-09-22) — список разрешённых источников, каждый элемент либо
# конкретный IP ("10.0.0.5"), либо CIDR-сеть ("10.0.0.0/24"). Пусто по умолчанию —
# принимаются пакеты с любого адреса, как и до появления этой настройки. ВАЖНО: v1/v2c
# community string передаётся ПЛАН ТЕКСТОМ и не является криптографической
# аутентификацией — это просто пароль, видимый в трафике и легко перебираемый; любой,
# кто может дослать UDP-пакет до bind_addr, может подделать trap от чужого имени. Только
# v3 (USM) реально аутентифицирует отправителя. allowed_sources — сетевой уровень
# защиты для v1/v2c, компенсирующий это отсутствие: ограничь его известными IP-адресами
# устройств, например allowed_sources = ["10.0.0.0/24"].
allowed_sources = []

[syslog]
# Syslog ingestion (RFC3164/5424) — приём push-сообщений от устройств по UDP, прямой
# сиблинг [snmp_trap] выше (та же причина дефолта enabled=false — включение открывает
# UDP-порт на приём). См. docs/Changelog/2026-09-06 - Syslog Ingestion.md за полным
# разбором дизайна. В отличие от SNMP Trap, у syslog в принципе нет протокольной
# аутентификации — резолвинг устройства только по source IP, регекс-биндинги на текст
# сообщения настраиваются в профиле устройства (не здесь).
enabled = false
# Не стандартный 514 порт по умолчанию — бинд на него требует root/CAP_NET_BIND_SERVICE.
# Для продакшна с реальным портом 514 указать явно и выдать процессу capability.
bind_addr = "0.0.0.0:1514"
# Размер in-memory пула воркеров, разбирающих уже провалидированные пакеты (НЕ через
# jobs-очередь). Тот же класс стоимости, что concurrency.snmp_poll/metric_poll.
ingest_concurrency = 8
# Token bucket на source IP, до всякого decode — та же первая линия защиты от шторма
# сообщений, что и у [snmp_trap].
rate_limit_per_source_per_sec = 20
# Ingress ACL (SEC-19, 2026-09-22) — тот же формат и то же поведение по умолчанию
# (пусто = без ограничений), что и у [snmp_trap].allowed_sources выше. Здесь особенно
# важен: у syslog UDP нет вообще никакой аутентификации отправителя (см. абзац выше про
# "нет протокольной аутентификации") — ограничение по source IP/сети это единственная
# защита от инъекции поддельных сообщений с произвольного адреса.
allowed_sources = []

[login_rate_limit]
# Защита POST /api/auth/login от подбора пароля (2026-09-12) — TokenBucket с непрерывным
# восполнением, ключ — пара (имя пользователя, IP-адрес источника). В отличие от
# [snmp_trap]/[syslog], у этой секции нет тумблера enabled — отключить её
# значило бы заново открыть ту самую уязвимость, ради которой она существует, поэтому
# лимитер работает всегда, вне зависимости от того, есть эта секция в файле или нет;
# здесь можно только подстроить параметры. См. docs/Architecture/Authentication и Permissions.md.
# Сколько попыток подряд разрешено без задержки, прежде чем включится троттлинг.
burst_capacity = 5
# Скорость восстановления попыток после исчерпания burst, попыток/сек — 1/60 по
# умолчанию (примерно одна восстановленная попытка в минуту).
refill_per_sec = 0.016666666666666666
# Как часто фоновый цикл вычищает не тронутые долгое время записи (username, ip) —
# защита от неограниченного роста карты в памяти на долгоживущем процессе.
