[package]
name = "discovery-core"
version = "0.1.0"
edition = "2021"
description = "Domain types shared by every discovery crate: devices, metrics, alerts, queue model. Zero dependency on siblings on purpose — this is the vocabulary everything else speaks."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"
thiserror = "1"
aes-gcm = "0.10"
base64 = "0.22"
