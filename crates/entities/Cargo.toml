[package]
name = "discovery-entities"
version = "0.1.0"
edition = "2021"
description = "sea-orm entity models, one per table — the single, backend-agnostic definition every domain store's sea-orm implementation queries against (Postgres/MySQL/SQLite from one code path, direct user request 2026-08-18, see discovery/README.md's \"Мульти-БД поддержка\")."

[dependencies]
sea-orm = { version = "1", default-features = false, features = ["macros", "with-uuid", "with-chrono", "with-json"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
