[package]
name = "discovery-notify"
version = "0.1.0"
edition = "2021"
description = "Notifier trait + a FakeNotifier for tests, plus RealNotifier — email (SMTP)/Telegram (Bot API)/webhook delivery for the notification channels + matrix feature (2026-09-10). Mirrors discovery-ping/discovery-servicecheck's real/fake split; depends only on discovery-core, same as those two."

[dependencies]
discovery-core = { path = "../core" }
async-trait = "0.1"
tokio = { version = "1", features = ["net"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
tracing = "0.1"
# HTTP delivery (webhook + Telegram Bot API) — same rustls-only choice as
# discovery-servicecheck's own reqwest dependency, for the same "no system TLS library"
# reasoning.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Webhook HMAC-SHA256 signing (`X-Discovery-Signature`) — both already present transitively
# in the workspace (aes-gcm's dependency tree), promoted to direct dependencies here rather
# than pulling in a second, unrelated crypto stack.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Email (SMTP) delivery.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
